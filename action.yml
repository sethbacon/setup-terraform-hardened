name: Setup Terraform (hardened)
description: Install Terraform or OpenTofu with signature verification on by default; no CLI wrapper, so raw exit codes are kept.
author: sethbacon
branding:
  icon: terminal
  color: purple

inputs:
  binary:
    description: Which CLI to install — "terraform" or "tofu" (OpenTofu).
    required: false
    default: terraform
  version:
    description: Version to install (e.g. "1.9.5"), or "latest".
    required: false
    default: latest
  require-checksum:
    description: >-
      Verify the downloaded archive against the published SHA256SUMS. Always
      performed when signature verification runs, because the signature covers
      SHA256SUMS and nothing else links it to the archive.
    required: false
    default: "true"
  require-gpg-signature:
    description: >-
      Terraform only — verify SHA256SUMS against HashiCorp's GPG signature, using
      the public key vendored at keys/hashicorp.asc. The signature is accepted only
      if gpg reports it was made by the pinned HashiCorp release key. "auto" (the
      default) means "true" for terraform and "false" for tofu; "false" opts out of
      authenticity checking and emits a warning.
    required: false
    default: auto
  require-cosign-verification:
    description: >-
      OpenTofu only — verify SHA256SUMS with cosign against the OpenTofu release
      identity. Requires the cosign CLI on PATH (e.g. sigstore/cosign-installer).
      "auto" (the default) means "true" for tofu and "false" for terraform; "false"
      opts out of authenticity checking and emits a warning.
    required: false
    default: auto

outputs:
  version:
    description: The resolved version that was installed.
    value: ${{ steps.install.outputs.version }}
  path:
    description: Directory the binary was installed into (also added to PATH).
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
        VERSION_IN: ${{ inputs.version }}
        REQUIRE_CHECKSUM: ${{ inputs.require-checksum }}
        REQUIRE_GPG: ${{ inputs.require-gpg-signature }}
        REQUIRE_COSIGN: ${{ inputs.require-cosign-verification }}
      run: |
        set -euo pipefail

        # --- pinned trust roots ---
        # HashiCorp release-signing key. SHA256SUMS is signed by this key's [S]
        # subkey, so a signature is accepted only when gpg reports this fingerprint
        # as the signing key itself or as the signing key's primary key.
        HASHICORP_FPR="C874011F0AB405110D02105534365D9472D7468F"
        # OpenTofu release identity. Anchored on purpose: an unanchored pattern also
        # matches identities such as https://github.com/opentofu/opentofu-evil/... .
        COSIGN_IDENTITY_RE='^https://github\.com/opentofu/opentofu/\.github/workflows/release\.yml@refs/'
        COSIGN_ISSUER="https://token.actions.githubusercontent.com"

        # --connect-timeout bounds the handshake and --max-time the whole
        # transfer: without the latter a peer that connects and then trickles
        # holds the step open until the job timeout (360 min by default), and
        # -s hides the stalled progress meter that would have shown it.
        # --retry-all-errors is what makes --retry cover a dropped connection
        # rather than only an HTTP status. --max-redirs bounds a redirect chain
        # that --proto-redir already pins to https.
        curl_get() {
          curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 3 \
            --connect-timeout 10 --max-time 300 --retry 3 --retry-delay 2 --retry-all-errors "$@"
        }
        # The two version-API responses are a few KB and are read into a command
        # substitution, i.e. into memory, so they get a size ceiling as well.
        curl_get_small() { curl_get --max-filesize 1048576 "$@"; }

        # --- input validation (a typo must not silently disable a check) ---
        case "$BINARY" in terraform|tofu) : ;; *) echo "::error::binary must be 'terraform' or 'tofu'"; exit 1 ;; esac
        case "$REQUIRE_CHECKSUM" in true|false) : ;; *) echo "::error::require-checksum must be 'true' or 'false' (got '$REQUIRE_CHECKSUM')"; exit 1 ;; esac
        case "$REQUIRE_GPG" in true|false|auto) : ;; *) echo "::error::require-gpg-signature must be 'true', 'false' or 'auto' (got '$REQUIRE_GPG')"; exit 1 ;; esac
        case "$REQUIRE_COSIGN" in true|false|auto) : ;; *) echo "::error::require-cosign-verification must be 'true', 'false' or 'auto' (got '$REQUIRE_COSIGN')"; exit 1 ;; esac

        # "auto" means "required for the binary this mechanism applies to": Terraform's
        # trust root is HashiCorp's GPG-signed SHA256SUMS, OpenTofu's is cosign against
        # the OpenTofu release identity. This is what makes the default fail closed.
        if [ "$REQUIRE_GPG" = "auto" ]; then
          if [ "$BINARY" = "terraform" ]; then REQUIRE_GPG=true; else REQUIRE_GPG=false; fi
        fi
        if [ "$REQUIRE_COSIGN" = "auto" ]; then
          if [ "$BINARY" = "tofu" ]; then REQUIRE_COSIGN=true; else REQUIRE_COSIGN=false; fi
        fi
        if [ "$REQUIRE_GPG" = "true" ] && [ "$BINARY" != "terraform" ]; then echo "::error::require-gpg-signature applies to terraform only; use require-cosign-verification for tofu"; exit 1; fi
        if [ "$REQUIRE_COSIGN" = "true" ] && [ "$BINARY" != "tofu" ]; then echo "::error::require-cosign-verification applies to tofu only; use require-gpg-signature for terraform"; exit 1; fi

        if [ "$REQUIRE_GPG" = "true" ] || [ "$REQUIRE_COSIGN" = "true" ]; then
          if [ "$REQUIRE_CHECKSUM" != "true" ]; then
            echo "::warning::require-checksum=false ignored: the signature covers SHA256SUMS only, so the archive is still compared against it"
            REQUIRE_CHECKSUM=true
          fi
        else
          echo "::warning::signature verification is disabled for $BINARY: SHA256SUMS is fetched from the same origin as the archive, so this run proves transfer integrity, not authenticity"
          if [ "$REQUIRE_CHECKSUM" != "true" ]; then
            echo "::warning::require-checksum=false: the downloaded archive is not verified at all"
          fi
        fi

        # --- platform mapping (Terraform/OpenTofu use the same os/arch names) ---
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        case "$os" in linux) os=linux ;; darwin) os=darwin ;; mingw*|msys*|cygwin*) os=windows ;; *) echo "::error::unsupported OS $os"; exit 1 ;; esac
        arch="$(uname -m)"
        case "$arch" in x86_64|amd64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) echo "::error::unsupported arch $arch"; exit 1 ;; esac

        work="$(mktemp -d)"; cd "$work"

        # --- resolve "latest" ---
        version="$VERSION_IN"
        if [ "$version" = "latest" ] || [ -z "$version" ]; then
          if [ "$BINARY" = "terraform" ]; then
            version="$(curl_get_small https://checkpoint-api.hashicorp.com/v1/check/terraform | grep -o '"current_version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          else
            version="$(curl_get_small https://api.github.com/repos/opentofu/opentofu/releases/latest | grep -o '"tag_name":"[^"]*"' | head -1 | cut -d'"' -f4)"
            version="${version#v}"
          fi
        fi
        version="${version#v}"
        [ -n "$version" ] || { echo "::error::could not resolve version"; exit 1; }
        # $version is spliced into the download URLs AND written to
        # $GITHUB_OUTPUT, both of which are line-oriented. An action input can
        # legally be multi-line, so assert the shape rather than relying on a
        # later step happening to fail first.
        case "$version" in
          *[!A-Za-z0-9._+-]*|"") echo "::error::version must contain only letters, digits, dot, underscore, plus or hyphen (got '$version')"; exit 1 ;;
        esac
        echo "Installing $BINARY $version ($os/$arch)"

        # --- URLs ---
        if [ "$BINARY" = "terraform" ]; then
          base="https://releases.hashicorp.com/terraform/${version}"
          zip="terraform_${version}_${os}_${arch}.zip"
          sums="terraform_${version}_SHA256SUMS"
          sig="terraform_${version}_SHA256SUMS.sig"
        else
          base="https://github.com/opentofu/opentofu/releases/download/v${version}"
          zip="tofu_${version}_${os}_${arch}.zip"
          sums="tofu_${version}_SHA256SUMS"
          sig="tofu_${version}_SHA256SUMS.sig"
        fi

        curl_get -o "$zip" "${base}/${zip}"
        curl_get -o "$sums" "${base}/${sums}"

        # --- GPG (terraform): authenticate SHA256SUMS before it is trusted ---
        if [ "$REQUIRE_GPG" = "true" ]; then
          command -v gpg >/dev/null 2>&1 || { echo "::error::gpg not found on PATH, so SHA256SUMS cannot be authenticated. Install gnupg on the runner, or set require-gpg-signature: 'false' to install without authenticity checking."; exit 1; }
          curl_get -o "$sig" "${base}/${sig}" || { echo "::error::could not download ${sig}; SHA256SUMS cannot be authenticated"; exit 1; }
          key="${GITHUB_ACTION_PATH:-}/keys/hashicorp.asc"
          [ -f "$key" ] || { echo "::error::vendored HashiCorp public key not found at ${key}"; exit 1; }
          GNUPGHOME="$work/gnupg"; export GNUPGHOME
          mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import "$key"
          # Bind the pin to the key that actually made the signature. gpg reports the
          # signing key ($3) and its primary key ($12) on the VALIDSIG status line, so
          # an extra key in the keyring cannot satisfy the pin for someone else's
          # signature — which is what checking only the first fpr: record allowed.
          status="$(gpg --batch --status-fd=1 --verify "$sig" "$sums" 2>/dev/null)" || {
            echo "::error::GPG verification of ${sums} failed"
            exit 1
          }
          printf '%s\n' "$status" | grep -q '^\[GNUPG:\] GOODSIG ' || { echo "::error::no good GPG signature over ${sums} (expired or revoked signing key?)"; exit 1; }
          sig_fpr="$(printf '%s\n' "$status" | awk '$1=="[GNUPG:]" && $2=="VALIDSIG" {print $3; exit}')"
          pri_fpr="$(printf '%s\n' "$status" | awk '$1=="[GNUPG:]" && $2=="VALIDSIG" && NF>=12 {print $12; exit}')"
          if [ "$sig_fpr" != "$HASHICORP_FPR" ] && [ "$pri_fpr" != "$HASHICORP_FPR" ]; then
            echo "::error::${sums} was signed by ${sig_fpr:-unknown} (primary ${pri_fpr:-unknown}), not the pinned HashiCorp key ${HASHICORP_FPR}"
            exit 1
          fi
          echo "GPG signature OK (signing key ${sig_fpr}, primary ${pri_fpr:-n/a})"
        fi

        # --- cosign (tofu): authenticate SHA256SUMS before it is trusted ---
        if [ "$REQUIRE_COSIGN" = "true" ]; then
          command -v cosign >/dev/null 2>&1 || { echo "::error::cosign not found on PATH. Add sigstore/cosign-installer before this step, or set require-cosign-verification: 'false' to install without authenticity checking."; exit 1; }
          curl_get -o "${sums}.sig" "${base}/${sums}.sig" || { echo "::error::could not download ${sums}.sig; SHA256SUMS cannot be authenticated"; exit 1; }
          curl_get -o "${sums}.pem" "${base}/${sums}.pem" || { echo "::error::could not download ${sums}.pem; SHA256SUMS cannot be authenticated"; exit 1; }
          cosign verify-blob \
            --certificate "${sums}.pem" \
            --signature "${sums}.sig" \
            --certificate-identity-regexp "$COSIGN_IDENTITY_RE" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" \
            "$sums"
          echo "cosign verification OK"
        fi

        # --- checksum: the only link between the authenticated SHA256SUMS and the archive ---
        if [ "$REQUIRE_CHECKSUM" = "true" ]; then
          grep " ${zip}\$" "$sums" | sha256sum -c -
          echo "checksum OK"
        fi

        # --- install ---
        # $GITHUB_PATH PREPENDS its entry, so whatever lands in $dest sits ahead
        # of /usr/bin for every later step in the consumer's job. Extract to a
        # scratch directory and install ONLY the binary this action claims to
        # install: an archive carrying an extra entry named git, node, bash or
        # sudo would otherwise shadow the real tool in steps that never invoke
        # terraform at all, and a composite action has no `post:` hook to revoke
        # the PATH entry with. `rm -rf` first because `mkdir -p` ADOPTS an
        # existing directory, and `unzip -o` only overwrites entries that are in
        # the archive, so a stale file would survive into PATH.
        exe="${BINARY}"
        [ "$os" = "windows" ] && exe="${BINARY}.exe"
        rm -rf "$work/x"
        unzip -o -q "$zip" -d "$work/x"
        [ -f "$work/x/$exe" ] || { echo "::error::archive did not contain the expected ${exe} binary"; exit 1; }
        dest="${RUNNER_TEMP:-/tmp}/${BINARY}-${version}"
        rm -rf "$dest"
        mkdir -p "$dest"
        install -m 0755 "$work/x/$exe" "$dest/$exe"

        # $GITHUB_PATH is parsed line by line and has no delimiter form, so a
        # newline here forges an extra directory onto PATH for every later step.
        case "$dest" in
          *[!-A-Za-z0-9._/+]*) echo "::error::refusing to add an install path with unexpected characters to PATH"; exit 1 ;;
        esac
        printf '%s\n' "$dest" >> "$GITHUB_PATH"

        # Delimiter form: `key=value` is only safe for a value that provably
        # cannot contain a newline. The delimiter is random so a value cannot
        # close its own heredoc and forge a second output.
        delim="ghout-$(head -c16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        {
          printf 'version<<%s\n%s\n%s\n' "$delim" "$version" "$delim"
          printf 'path<<%s\n%s\n%s\n' "$delim" "$dest" "$delim"
        } >> "$GITHUB_OUTPUT"
        echo "Installed $BINARY $version to $dest/$exe"
