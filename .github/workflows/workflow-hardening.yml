---
# Workflow-hardening gate, delegated to 4cloudguru/shared-workflows.
#
# Asserts four properties are ENFORCED rather than conventionally held: every
# `uses:` pinned to a full SHA and labelled with the version that SHA is, every
# job bounded by a timeout, harden-runner running first, and npm installs
# refusing dependency scripts.
#
# script-ref MUST equal the pin on the `uses:` line: the checker is taken from
# shared-workflows at that commit, so this repo cannot weaken its own gate by
# editing a local copy -- there is no local copy.
name: Workflow Hardening

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: workflow-hardening-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # zizmor audits workflow SECURITY (credential persistence, template injection,
  # unpinned refs); the hardening gate below audits workflow HARDENING. Same
  # family, different questions, and this repository ships a GitHub Action, so
  # workflow-security lint is more directly relevant here than in most of the
  # nine repositories that already run it.
  #
  # Taken from shared-workflows rather than run locally on purpose. Five repos in
  # this estate invoke zizmor-action directly and leave `advanced-security` at its
  # default of true, which selects --format=sarif -- where zizmor EXITS 0 WHATEVER
  # IT FINDS. Their "Scan Workflows (zizmor)" check is green by construction:
  # terraform-drift-contract's is green right now with three findings open as code
  # scanning alerts. The shared definition sets advanced-security: false, so it
  # fails the build instead of filing a report nobody reads.
  workflow-security:
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-security.yml@3dac549c7e4fe4a0dc54aaf9ed187b6da2c6eab9 # v1.15.0

  workflow-hardening:
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-hardening.yml@3dac549c7e4fe4a0dc54aaf9ed187b6da2c6eab9 # v1.15.0
    with:
      script-ref: 3dac549c7e4fe4a0dc54aaf9ed187b6da2c6eab9