version: 2

updates:
  # SHA pinning and automated updates are two halves of one control: the pin
  # stops a dependency changing under you, and this is what tells you the thing
  # you pinned has a published fix. Without it the pins in pr-checks.yml and
  # ci.yml — including a third-party action that is handed GITHUB_TOKEN — freeze
  # at whatever was current the day they were written. Dependabot rewrites the
  # SHA and keeps the trailing `# vX.Y.Z` comment in sync, which is also what
  # zizmor's ref-version-mismatch audit checks.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # zizmor dependabot-cooldown: the implicit default is 3 days; 7 is the
    # estate standard and what the audit requires. Security updates are exempt
    # from cooldown, so this delays feature bumps, not fixes.
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-dependencies:
        patterns:
          - '*'
